name: Publish

on: [ push, pull_request ]

jobs:
  publish:
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            asset_suffix: '.exe'
          - os: ubuntu-latest
            runtime: linux-x64
            asset_suffix: ''
          - os: macos-latest
            runtime: osx-x64
            asset_suffix: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set GH_TOKEN environment variable (Linux/Mac)
        if: ${{ matrix.os != 'windows-latest' }}
        run: echo "GH_TOKEN=${{ secrets.GH_TOKEN }}" >> $GITHUB_ENV
        shell: bash

      - name: Set GH_TOKEN environment variable (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: echo "GH_TOKEN=${{ secrets.GH_TOKEN }}" >> $env:GITHUB_ENV
        shell: pwsh
        
      - name: Download ANTLR
        shell: bash
        run: |
          mkdir ./BishLanguage/tools
          curl -L https://www.antlr.org/download/antlr-4.13.2-complete.jar -o ./BishLanguage/tools/antlr.jar

      - name: Start httpbin service (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          docker run -d -p 8080:80 --name httpbin-service kennethreitz/httpbin
          
      - name: Run tests
        shell: bash
        run: dotnet test

      - name: Publish common runtime project
        shell: bash
        run: |
          dotnet publish ./Bish/Bish.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Upload runtime artifact for ${{ matrix.os }}
        uses: actions/upload-artifact@v7
        with:
          name: Bish-${{ matrix.os }}
          path: |
            publish/Bish${{ matrix.asset_suffix }}
            publish/lib/
      
      - name: Build Bish language project
        shell: bash
        run: dotnet build -c Release

      - name: Upload Bish language artifact for ${{ matrix.os }}
        uses: actions/upload-artifact@v7
        with:
          name: BishLanguage-${{ matrix.os }}
          path: |
            publish/BishLanguage.dll
            publish/Antlr4.Runtime.Standard.dll